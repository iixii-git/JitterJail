<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JitterJail</title>
  <!-- Schriftart passend zum JitterJail-Logo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --banner-height: 110px;
      --sidebar-width: 240px;
      --bg-gray: #d9d9d9;
      --sidebar-gray: #c7c7c7;
      --hover-gray: #b5b5b5;
      --accent-color: #28969e;
      --text-color: #222222;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--bg-gray);
      color: var(--text-color);
      overflow: hidden;
    }

    /* Fixierter Banner oben */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--banner-height);
      background-color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }

    header a {
      height: 100%;
      display: flex;
      align-items: center;
    }

    header img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
    }

    /* Hauptlayout unter dem Banner */
    .layout {
      display: flex;
      margin-top: var(--banner-height);
      height: calc(100vh - var(--banner-height));
    }

    /* Linke Menüspalte */
    nav.sidebar {
      width: var(--sidebar-width);
      background-color: var(--sidebar-gray);
      border-right: 1px solid #aaaaaa;
      padding: 20px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      text-decoration: none;
      color: var(--text-color);
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
      transition: background-color 0.2s, border-left 0.2s;
      border-left: 4px solid transparent;
    }

    .menu-item:hover {
      background-color: var(--hover-gray);
    }

    .menu-item.active {
      background-color: #bcbcbc;
      border-left: 4px solid var(--accent-color);
    }

    .menu-item img {
      width: 34px;
      height: 34px;
      object-fit: contain;
      /* Macht einen eventuellen weißen Hintergrund des S/W-Logos transparent */
      mix-blend-mode: multiply;
    }

    /* Freier Bereich für die Seiten */
    main.content {
      flex: 1;
      background-color: var(--bg-gray);
      height: 100%;
    }

    main.content iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Fixierter Banner -->
  <header>
    <a href="start.html" target="content-frame" id="banner-link" title="Zur Startseite">
      <img src="JitterJail_Banner_klein.jpg" alt="JitterJail Banner">
    </a>
  </header>

  <div class="layout">
    <!-- Menüspalte links -->
    <nav class="sidebar">
      <a href="menu1.html" target="content-frame" class="menu-item">
        <img src="JitterJail_klein_sw.png" alt="Logo">
        <span>menu1</span>
      </a>
      <a href="menu2.html" target="content-frame" class="menu-item">
        <img src="JitterJail_klein_sw.png" alt="Logo">
        <span>menu2</span>
      </a>
      <a href="menu3.html" target="content-frame" class="menu-item">
        <img src="JitterJail_klein_sw.png" alt="Logo">
        <span>menu3</span>
      </a>
      <a href="menu4.html" target="content-frame" class="menu-item">
        <img src="JitterJail_klein_sw.png" alt="Logo">
        <span>menu4</span>
      </a>
      <a href="menu5.html" target="content-frame" class="menu-item">
        <img src="JitterJail_klein_sw.png" alt="Logo">
        <span>menu5</span>
      </a>
    </nav>

    <!-- Inhaltsbereich rechts -->
    <main class="content">
      <iframe name="content-frame" src="start.html" title="Inhaltsbereich"></iframe>
    </main>
  </div>

  <script>
    const menuItems = document.querySelectorAll('.menu-item');
    const bannerLink = document.getElementById('banner-link');

    menuItems.forEach(item => {
      item.addEventListener('click', () => {
        menuItems.forEach(el => el.classList.remove('active'));
        item.classList.add('active');
      });
    });

    bannerLink.addEventListener('click', () => {
      menuItems.forEach(el => el.classList.remove('active'));
    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Start</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      height: 100dvh;
      background-color: #d9d9d9;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 20px;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .logo-container {
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse-and-float 4s ease-in-out infinite;
    }

    /* Wenn das Logo zittert, pausiert die Schwebe-Animation auf dem Container */
    .logo-container.is-jittering {
      animation: none;
    }

    img {
      max-width: 480px;
      width: 75vw;
      height: auto;
      display: block;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /* Zitter-Animation bei Mauskontakt, Antippen oder automatisch nach 3 Sekunden */
    img:hover,
    img:active,
    img.is-jittering {
      animation: jitter 0.14s linear infinite;
    }

    @keyframes pulse-and-float {
      0% {
        transform: translateY(0) scale(1);
        filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.06));
      }
      50% {
        transform: translateY(-8px) scale(1.03);
        filter: drop-shadow(0 12px 20px rgba(0, 0, 0, 0.12));
      }
      100% {
        transform: translateY(0) scale(1);
        filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.06));
      }
    }

    @keyframes jitter {
      0%   { transform: translate(0, 0) rotate(0deg); }
      20%  { transform: translate(-3px, 2px) rotate(-0.8deg); }
      40%  { transform: translate(3px, -2px) rotate(0.8deg); }
      60%  { transform: translate(-2px, -2px) rotate(-0.5deg); }
      80%  { transform: translate(2px, 3px) rotate(0.5deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    /* Animierter Pfeil nur auf mobilen Bildschirmen direkt nach oben Richtung Hamburger-Menü */
    .jj-mobile-menu-hint {
      display: none;
    }

    @media (max-width: 768px) {
      .jj-mobile-menu-hint {
        position: fixed;
        top: 14px;
        right: 16px;
        z-index: 9999;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(255, 255, 255, 0.95);
        color: #0f172a;
        border: 2px solid #28969e;
        border-radius: 999px;
        padding: 6px 12px 6px 14px;
        box-shadow: 0 8px 22px rgba(15, 23, 42, 0.2);
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .jj-hint-arrow {
        animation: jj-point-up 1.15s ease-in-out infinite;
      }

      @keyframes jj-point-up {
        0%, 100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-5px);
        }
      }
    }
  </style>
</head>
<body>
  <button type="button" class="jj-mobile-menu-hint" id="jj-mobile-menu-hint" aria-label="Menü öffnen">
    <span>Menü</span>
    <svg class="jj-hint-arrow" width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M12 19V5M12 5L6 11M12 5L18 11" stroke="#28969e" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <div class="logo-container" id="logo-container">
    <img src="JitterJail_klein_sw.png" alt="JitterJail Logo S/W" id="start-logo">
  </div>

  <script>
    const logoContainer = document.getElementById('logo-container');
    const logo = document.getElementById('start-logo');
    const menuHint = document.getElementById('jj-mobile-menu-hint');
    let jitterTimeout;

    function startJitter(durationMs) {
      logo.classList.add('is-jittering');
      logoContainer.classList.add('is-jittering');
      clearTimeout(jitterTimeout);
      if (durationMs) {
        jitterTimeout = setTimeout(() => {
          logo.classList.remove('is-jittering');
          logoContainer.classList.remove('is-jittering');
        }, durationMs);
      }
    }

    // Nach 3 Sekunden automatisch zittern lassen (für 2,5 Sekunden)
    const autoJitterTimer = setTimeout(() => {
      startJitter(2500);
    }, 3000);

    // Bei Klick/Touch das Zittern für 1,2 Sekunden auslösen
    logo.addEventListener('click', () => {
      clearTimeout(autoJitterTimer);
      startJitter(1200);
    });

    // Mobiler Pfeil-Hinweis: öffnet das Eltern-Menü (falls im iframe) und bleibt dauerhaft sichtbar
    if (menuHint) {
      menuHint.addEventListener('click', () => {
        try {
          if (window.parent && window.parent !== window) {
            const parentDoc = window.parent.document;
            const sidebar = parentDoc.getElementById('sidebar');
            const toggle = parentDoc.getElementById('menu-toggle');
            if (sidebar && !sidebar.classList.contains('open') && toggle) {
              toggle.click();
            }
          }
        } catch (err) {
          // Falls Cross-Origin aktiv ist, ignorieren
        }
      });
    }
  </script>
</body>
</html>

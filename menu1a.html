<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JitterJail – In Arbeit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gray: #d9d9d9;
      --card-bg: #ffffff;
      --accent-color: #28969e;
      --accent-glow: rgba(40, 150, 158, 0.25);
      --text-color: #1a1a1a;
      --text-muted: #555555;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--bg-gray);
      color: var(--text-color);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .construction-card {
      position: relative;
      max-width: 480px;
      width: 100%;
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      border-top: 4px solid var(--accent-color);
      overflow: hidden;
    }

    /* Dezente animierte Linie passend zur Sidebar */
    .construction-card::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(
        90deg,
        rgba(40, 150, 158, 0.15) 0%,
        rgba(40, 150, 158, 0.9) 50%,
        rgba(40, 150, 158, 0.15) 100%
      );
      background-size: 200% 100%;
      animation: flow-horizontal 4s ease-in-out infinite;
    }

    @keyframes flow-horizontal {
      0%, 100% { background-position: 0% 0%; }
      50% { background-position: 100% 0%; }
    }

    .icon-wrapper {
      width: 68px;
      height: 68px;
      margin: 0 auto 20px auto;
      border-radius: 50%;
      background-color: rgba(40, 150, 158, 0.12);
      color: var(--accent-color);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 0 6px rgba(40, 150, 158, 0.05);
    }

    .icon-wrapper svg {
      width: 34px;
      height: 34px;
    }

    .status-badge {
      display: inline-block;
      padding: 5px 12px;
      margin-bottom: 14px;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent-color);
      background-color: rgba(40, 150, 158, 0.12);
      border-radius: 999px;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--text-color);
    }

    p {
      font-size: 15.5px;
      line-height: 1.6;
      color: var(--text-muted);
    }

    @media (max-width: 480px) {
      .construction-card {
        padding: 32px 22px;
      }

      h1 {
        font-size: 21px;
      }

      p {
        font-size: 14.5px;
      }
    }
  </style>
</head>
<body>

  <div class="construction-card">
    <div class="icon-wrapper" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
      </svg>
    </div>

    <div class="status-badge">In Vorbereitung</div>
    <h1>Hier wird noch geschraubt</h1>
    <p>
      Dieser Bereich befindet sich aktuell noch im Aufbau. Sobald die letzten Details formuliert sind, findest du hier alle Infos.
    </p>
  </div>

</body>
</html>
